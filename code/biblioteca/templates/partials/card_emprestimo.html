<div class="card" id="emprestimo-{{ emprestimo.id }}">
    <div class="card-info">
        <p><strong>Código:</strong> {{ emprestimo.id }}</p>
        <p><strong>Exemplar:</strong> {{ emprestimo.exemplar }}</p>

        <p class="data-emprestimo" data-date="{{ emprestimo.data_emprestimo|date:'Y-m-d' }}">
            <strong>Data empréstimo:</strong> {{ emprestimo.data_emprestimo }}
        </p>

        <p><strong>Data devolução:</strong>
            {% if emprestimo.data_devolucao %}
                {{ emprestimo.data_devolucao }}
            {% else %}
                -
            {% endif %}
        </p>
    </div>

    {% if not emprestimo.data_devolucao %}
        <button class="card-btn"
                hx-post="{% url 'devolver' emprestimo.id %}"
                hx-target="#emprestimo-{{ emprestimo.id }}"
                hx-confirm="Quer mesmo devolver esse livro?"
                hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'
                hx-swap="outerHTML">
            DEVOLVER
        </button>
    {% endif %}
</div>
