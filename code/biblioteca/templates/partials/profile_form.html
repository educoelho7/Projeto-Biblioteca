<form 
    class="profile-form"
    hx-post="{% url 'alterar_perfil' %}"
    hx-target="#profile-form-container"
    hx-swap="innerHTML"
>
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input name="email" type="email" value="{{ user.email }}">
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input name="telefone" type="tel" maxlength="15" value="{{ user.telefone }}" oninput="formatPhone(this)">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input name="nome" type="text" value="{{ user.first_name }}">
      </div>

      <div class="form-group">
        <label for="sobrenome">Sobrenome</label>
        <input name="sobrenome" type="text" value="{{ user.last_name }}">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="senha">Senha</label>
        <input name="senha" type="password" value="">
      </div>

      <div class="form-group">
        <label for="nova-senha">Nova senha</label>
        <input name="nova-senha" type="password" value="">
      </div>
    </div>

    <button type="submit" class="profile-save-btn">SALVAR</button>
</form>

<script>
    function formatPhone(input) {
        let digits = input.value.replace(/\D/g, "");

        if (digits.length > 11) digits = digits.slice(0, 11);

        let formatted = "";

        if (digits.length > 0) {
            formatted += "(" + digits.slice(0, 2);
        }
        if (digits.length >= 3) {
            formatted += ") " + digits.slice(2, digits.length >= 7 ? 7 : 6);
        }
        if (digits.length >= 7) {
            let dashIndex = digits.length === 11 ? 7 : 6;
            formatted = "(" + digits.slice(0, 2) + ") " +
                        digits.slice(2, dashIndex) + "-" +
                        digits.slice(dashIndex);
        }

        input.value = formatted;
    }
</script>
