{% extends 'headerFooter.html' %}
{% load static %}

{% block content %}
<main class="main-content"> 
    <h2>Livros</h2>

    <div class="search-container">
        <input 
            type="text" 
            id="searchInput"
            name="q" 
            placeholder="Pesquisar livro" 
            value="{{ query }}"
            hx-get="/livros"
            hx-target="#livros-container"
            hx-trigger="keyup"
        />
        <button class="search-btn" type="button">
            <img src="{% static 'iconePesquisa.svg' %}" alt="Ícone pesquisa">
        </button>
    </div>

    <div id="livros-container">
        {% include 'partials/lista_livros.html' %}
    </div>
    
</main> 
{% endblock %}
